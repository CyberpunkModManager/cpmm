[package]
name = "cpmm-gui"
version = "0.1.0"
edition = "2024"
description = "cpmm desktop GUI"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gilrs = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
