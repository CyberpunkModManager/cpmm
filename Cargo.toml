[package]
name = "cpmm"
version = "0.1.0"
edition = "2024"
description = "Cyberpunk 2077 mod manager for Linux/Proton with an overlayfs virtual file system"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
walkdir = "2"
libc = "0.2"
regex = "1"
roxmltree = "0.20"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
